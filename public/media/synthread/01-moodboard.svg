<svg xmlns="http://www.w3.org/2000/svg" width="680" height="455" viewBox="0 0 680 455" role="img" aria-labelledby="title desc">
  <title id="title">synThread visual identity mood board</title><desc id="desc">Charcoal background, pastel gradient wordmark, color palette, serif headline sample, and violet pill button.</desc>
  <defs><linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4B8D0"/><stop offset=".3" stop-color="#F5E6A8"/><stop offset=".58" stop-color="#A8E6B0"/><stop offset=".82" stop-color="#A8D0F0"/><stop offset="1" stop-color="#BEB1F4"/></linearGradient></defs>
  <rect width="680" height="455" fill="#2B2622"/>
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="54" y="46" fill="#9D9690" font-size="12" font-weight="600" letter-spacing="1.6">IDENTITY / 01</text>
    <text x="54" y="128" fill="url(#wordmark)" font-size="73" font-weight="650" letter-spacing="-3">synThread</text>
    <text x="55" y="158" fill="#E8E3DE" font-family="Georgia, Times New Roman, serif" font-size="19">your listening history, woven into form</text>
    <text x="54" y="213" fill="#9D9690" font-size="11" font-weight="600" letter-spacing="1.4">PALETTE</text>
    <g transform="translate(54 229)">
      <rect width="74" height="74" rx="12" fill="#2B2622" stroke="#5A5450"/><rect x="84" width="74" height="74" rx="12" fill="#F4B8D0"/><rect x="168" width="74" height="74" rx="12" fill="#F5E6A8"/><rect x="252" width="74" height="74" rx="12" fill="#A8E6B0"/><rect x="336" width="74" height="74" rx="12" fill="#A8D0F0"/><rect x="420" width="74" height="74" rx="12" fill="#7C6FCB"/><rect x="504" width="74" height="74" rx="12" fill="#FFFFFF"/>
      <g fill="#BDB6AF" font-size="10"><text x="0" y="92">#2B2622</text><text x="84" y="92">#F4B8D0</text><text x="168" y="92">#F5E6A8</text><text x="252" y="92">#A8E6B0</text><text x="336" y="92">#A8D0F0</text><text x="420" y="92">#7C6FCB</text><text x="504" y="92">#FFFFFF</text></g>
    </g>
    <text x="54" y="367" fill="#9D9690" font-size="11" font-weight="600" letter-spacing="1.4">PRIMARY ACTION</text>
    <rect x="54" y="383" width="174" height="48" rx="24" fill="#7C6FCB"/><text x="141" y="413" fill="#FFFFFF" font-size="15" font-weight="650" text-anchor="middle">Get started</text>
    <text x="270" y="404" fill="#9D9690" font-size="10">warm editorial minimalism</text><text x="270" y="420" fill="#9D9690" font-size="10">soft color / generous space / quiet chrome</text>
