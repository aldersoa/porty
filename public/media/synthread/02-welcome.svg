<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc">
  <title id="title">synThread welcome screen</title><desc id="desc">A portrait phone mockup with a gradient synThread wordmark, editorial headline, and violet Start button.</desc>
  <defs><linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4B8D0"/><stop offset=".3" stop-color="#F5E6A8"/><stop offset=".58" stop-color="#A8E6B0"/><stop offset=".82" stop-color="#A8D0F0"/><stop offset="1" stop-color="#BEB1F4"/></linearGradient></defs>
  <rect width="680" height="700" fill="#F7F7F3"/><rect x="185" y="30" width="310" height="630" rx="40" fill="#151311"/><rect x="197" y="42" width="286" height="606" rx="30" fill="#2B2622"/><rect x="310" y="42" width="60" height="16" rx="8" fill="#0F0D0B"/>
  <text x="340" y="106" fill="url(#wordmark)" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="650" letter-spacing="-1" text-anchor="middle">synThread</text>
  <g transform="translate(226 398)"><text x="114" y="0" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="31" font-weight="500" text-anchor="middle"><tspan x="114" dy="0">What would your</tspan><tspan x="114" dy="37">taste in music</tspan><tspan x="114" dy="37">look like worn?</tspan></text><text x="114" y="133" fill="#BDB6AF" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" text-anchor="middle">Turn your listening history into a pattern.</text></g>
  <rect x="264" y="570" width="152" height="50" rx="25" fill="#7C6FCB"/><text x="340" y="601" fill="#FFFFFF" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Start</text><rect x="307" y="631" width="66" height="4" rx="2" fill="#5B554F"/>
</svg>
