<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc">
  <title id="title">synThread Spotify connection screen</title><desc id="desc">A simple authorization card over the dimmed synThread welcome screen.</desc>
  <defs><linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4B8D0"/><stop offset=".3" stop-color="#F5E6A8"/><stop offset=".58" stop-color="#A8E6B0"/><stop offset=".82" stop-color="#A8D0F0"/><stop offset="1" stop-color="#BEB1F4"/></linearGradient></defs>
  <rect width="680" height="700" fill="#F7F7F3"/><rect x="185" y="30" width="310" height="630" rx="40" fill="#151311"/><rect x="197" y="42" width="286" height="606" rx="30" fill="#2B2622"/><rect x="310" y="42" width="60" height="16" rx="8" fill="#0F0D0B"/>
  <text x="340" y="106" fill="url(#wordmark)" opacity=".38" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="650" letter-spacing="-1" text-anchor="middle">synThread</text><rect x="197" y="42" width="286" height="606" rx="30" fill="#090807" opacity=".62"/>
  <rect x="218" y="188" width="244" height="324" rx="20" fill="#121212"/><circle cx="340" cy="236" r="25" fill="#1DB954"/><g fill="none" stroke="#0C0C0C" stroke-width="3" stroke-linecap="round"><path d="M326 229c10-4 22-3 30 2"/><path d="M328 237c8-3 18-2 25 2"/><path d="M330 245c6-2 14-1 19 2"/></g>
  <text x="340" y="289" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="24" text-anchor="middle">Connect your music</text><text x="340" y="317" fill="#A7A7A7" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" text-anchor="middle">synThread reads your top tracks to build</text><text x="340" y="333" fill="#A7A7A7" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" text-anchor="middle">a personal textile pattern.</text>
  <g fill="#D6D6D6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10"><circle cx="257" cy="368" r="3" fill="#7C6FCB"/><text x="270" y="372">Top artists and tracks</text><circle cx="257" cy="392" r="3" fill="#7C6FCB"/><text x="270" y="396">Listening traits and eras</text><circle cx="257" cy="416" r="3" fill="#7C6FCB"/><text x="270" y="420">Read-only access</text></g>
  <rect x="243" y="443" width="194" height="44" rx="22" fill="#1DB954"/><text x="340" y="470" fill="#0C0C0C" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Continue with Spotify</text><rect x="307" y="631" width="66" height="4" rx="2" fill="#3D3935"/>
</svg>
