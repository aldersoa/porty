<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc"><title id="title">synThread pattern explanation</title><desc id="desc">A phone screen explaining how tempo, energy, mood, texture, and musical eras shaped the generated textile.</desc><defs><linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4B8D0"/><stop offset=".3" stop-color="#F5E6A8"/><stop offset=".58" stop-color="#A8E6B0"/><stop offset=".82" stop-color="#A8D0F0"/><stop offset="1" stop-color="#BEB1F4"/></linearGradient><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F4B8D0"/><stop offset=".28" stop-color="#F5E6A8"/><stop offset=".58" stop-color="#A8E6B0"/><stop offset=".82" stop-color="#A8D0F0"/><stop offset="1" stop-color="#7C6FCB"/></linearGradient></defs>
  <rect width="680" height="700" fill="#F7F7F3"/><rect x="185" y="30" width="310" height="630" rx="40" fill="#151311"/><rect x="197" y="42" width="286" height="606" rx="30" fill="#2B2622"/><rect x="310" y="42" width="60" height="16" rx="8" fill="#0F0D0B"/><text x="340" y="94" fill="url(#wordmark)" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" letter-spacing="-1" text-anchor="middle">synThread</text><text x="222" y="139" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="22">Your listening, translated</text><text x="222" y="161" fill="#9D9690" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10">Seven eras. One woven signature.</text>
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif"><g transform="translate(222 201)"><text fill="#DCD5CF" font-size="10" font-weight="650">TEMPO</text><text x="236" fill="#8F8780" font-size="9" text-anchor="end">repeat density</text><rect y="13" width="236" height="5" rx="2.5" fill="#49433E"/><rect y="13" width="176" height="5" rx="2.5" fill="#F4B8D0"/></g><g transform="translate(222 249)"><text fill="#DCD5CF" font-size="10" font-weight="650">ENERGY</text><text x="236" fill="#8F8780" font-size="9" text-anchor="end">contrast + scale</text><rect y="13" width="236" height="5" rx="2.5" fill="#49433E"/><rect y="13" width="198" height="5" rx="2.5" fill="#F5E6A8"/></g><g transform="translate(222 297)"><text fill="#DCD5CF" font-size="10" font-weight="650">VALENCE</text><text x="236" fill="#8F8780" font-size="9" text-anchor="end">palette warmth</text><rect y="13" width="236" height="5" rx="2.5" fill="#49433E"/><rect y="13" width="152" height="5" rx="2.5" fill="#A8E6B0"/></g><g transform="translate(222 345)"><text fill="#DCD5CF" font-size="10" font-weight="650">ACOUSTICNESS</text><text x="236" fill="#8F8780" font-size="9" text-anchor="end">surface texture</text><rect y="13" width="236" height="5" rx="2.5" fill="#49433E"/><rect y="13" width="94" height="5" rx="2.5" fill="#A8D0F0"/></g></g>
  <text x="222" y="420" fill="#9D9690" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.3">LISTENING ERA</text><rect x="222" y="436" width="236" height="8" rx="4" fill="url(#spectrum)"/><g fill="#8F8780" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="8"><text x="222" y="458">1980</text><text x="300" y="458">2000</text><text x="374" y="458">2010</text><text x="438" y="458">NOW</text></g><text x="222" y="497" fill="#9D9690" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.3">THREAD SOURCES</text><text x="222" y="520" fill="#ECE7E2" font-family="Georgia, Times New Roman, serif" font-size="12">Talking Heads · A Tribe Called Quest</text><text x="222" y="540" fill="#ECE7E2" font-family="Georgia, Times New Roman, serif" font-size="12">Radiohead · Daft Punk · Kendrick Lamar</text><text x="222" y="560" fill="#ECE7E2" font-family="Georgia, Times New Roman, serif" font-size="12">Tame Impala · Khruangbin</text><rect x="273" y="586" width="134" height="36" rx="18" fill="#3A3430"/><text x="340" y="609" fill="#FFF" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="650" text-anchor="middle">Continue</text><rect x="307" y="631" width="66" height="4" rx="2" fill="#5B554F"/>
