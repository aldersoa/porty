<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc"><title id="title">synThread save and share screen</title><desc id="desc">A phone screen presenting a textile pattern card with options to save, share, or make another.</desc><defs><linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4B8D0"/><stop offset=".3" stop-color="#F5E6A8"/><stop offset=".58" stop-color="#A8E6B0"/><stop offset=".82" stop-color="#A8D0F0"/><stop offset="1" stop-color="#BEB1F4"/></linearGradient><linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EC9FC0"/><stop offset=".32" stop-color="#F1D886"/><stop offset=".64" stop-color="#78C99A"/><stop offset="1" stop-color="#7EAEDB"/></linearGradient><pattern id="weave" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><rect width="30" height="30" fill="url(#cloth)"/><path d="M0 5h30M0 16h30M0 27h30" stroke="#2B2622" stroke-width="4" opacity=".75"/><path d="M7 0v30M23 0v30" stroke="#FFF4D2" stroke-width="3" opacity=".55"/><circle cx="15" cy="10" r="3" fill="#7C6FCB" opacity=".8"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter></defs>
  <rect width="680" height="700" fill="#F7F7F3"/><rect x="185" y="30" width="310" height="630" rx="40" fill="#151311"/><rect x="197" y="42" width="286" height="606" rx="30" fill="#2B2622"/><rect x="310" y="42" width="60" height="16" rx="8" fill="#0F0D0B"/><text x="340" y="94" fill="url(#wordmark)" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" letter-spacing="-1" text-anchor="middle">synThread</text><text x="340" y="137" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle"><tspan x="340">Take your thread</tspan><tspan x="340" dy="25">with you</tspan></text><text x="340" y="184" fill="#9D9690" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" text-anchor="middle">Electric nostalgia · generated today</text>
  <g filter="url(#shadow)"><rect x="242" y="214" width="196" height="226" rx="18" fill="#EEE9E3"/><rect x="258" y="230" width="164" height="152" rx="12" fill="url(#weave)"/><text x="258" y="409" fill="#2B2622" font-family="Georgia, Times New Roman, serif" font-size="17">Electric nostalgia</text><text x="258" y="427" fill="#746D67" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="8">synThread / listening pattern 01</text></g><g font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="650"><rect x="222" y="477" width="112" height="43" rx="21.5" fill="#7C6FCB"/><text x="278" y="503" fill="#FFF" text-anchor="middle">Save image</text><rect x="346" y="477" width="112" height="43" rx="21.5" fill="#3A3430" stroke="#625B55"/><text x="402" y="503" fill="#FFF" text-anchor="middle">Share</text></g><text x="340" y="558" fill="#BEB7B0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" text-anchor="middle">Make another pattern</text><path d="M281 565h118" stroke="#7C6FCB" stroke-width="1"/><rect x="307" y="631" width="66" height="4" rx="2" fill="#5B554F"/>
